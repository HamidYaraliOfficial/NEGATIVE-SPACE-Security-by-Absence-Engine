[package]
name = "negspace-agent"
version = "0.1.0"
edition = "2021"
description = "NEGATIVE SPACE host sensor - low-level process/network/heartbeat telemetry collector"
license = "Apache-2.0"

[[bin]]
name = "negspace-agent"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
reqwest = { version = "0.12", features = ["json", "gzip"] }
sysinfo = "0.31"
uuid = { version = "1.9", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
flate2 = "1.0"
clap = { version = "4.5", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
panic = "abort"
strip = true
